# てくあみの iOS 版を GitHub のクラウド Mac で組み立て、TestFlight へ送る。
# 持ち主は Mac を持っていないので、これが iOS を組み立てる唯一の道。Actions の画面から手で実行する。
# 最初は compile_only=true で、署名なしでコンパイルが通るかだけを確かめる(Apple のシークレット不要)。
# 必要なシークレット: ASC_KEY_ID / ASC_ISSUER_ID / APPLE_TEAM_ID / ASC_KEY_P8_BASE64(RELEASE.md の「iOS」)。
# HealthKit を使うので、App ID(jp.tekuami.app)に HealthKit の Capability が要る。自動署名で付かないときは RELEASE.md の手順で付ける。
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      compile_only:
        description: "署名もアップロードもせずにコンパイルだけ試す(Apple のシークレット不要)"
        type: boolean
        default: true

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test, build web assets and sync the iOS project
        run: |
          npm test
          npm run build
          npx cap sync ios
          python3 tools/patch_ios.py

      - name: Compile without signing
        if: inputs.compile_only
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Check secrets
        if: ${{ !inputs.compile_only }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set"; exit 1; fi
          done
          if [ -z "${{ secrets.ASC_KEY_P8_BASE64 }}" ]; then echo "::error::Secret ASC_KEY_P8_BASE64 is not set"; exit 1; fi

      - name: Install App Store Connect API key
        if: ${{ !inputs.compile_only }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      # ニガテ帳・DIAMOND NINE は「署名なしでアーカイブ → 書き出しで署名」だった。
      # てくあみは HealthKit の entitlements を中に入れる必要があるので、アーカイブの時点から自動署名する(API キーで証明書とプロファイルを用意させる)。
      - name: Archive
        if: ${{ !inputs.compile_only }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Check HealthKit entitlement in the archive
        if: ${{ !inputs.compile_only }}
        run: |
          codesign -d --entitlements :- "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" | tee "$RUNNER_TEMP/ent.plist"
          grep -q "com.apple.developer.healthkit" "$RUNNER_TEMP/ent.plist" || { echo "::error::HealthKit entitlement is missing"; exit 1; }

      - name: Export and upload to TestFlight
        if: ${{ !inputs.compile_only }}
        run: |
          plutil -replace teamID -string "$APPLE_TEAM_ID" ios/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
